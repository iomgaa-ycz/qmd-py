[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qmd"
version = "0.1.1"
description = "An on-device hybrid search engine for Markdown documents"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Chengzhang Yu"}]
keywords = ["search", "rag", "markdown", "bm25", "vector-search", "mcp"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "sqlite-vec",
    "PyYAML",
    "pydantic",
    "loguru",
    "watchdog",
]

[project.optional-dependencies]
mvp = [
    "sentence-transformers",
    "FlagEmbedding",
    "llama-cpp-python",
    "torch",
]
mcp = [
    "mcp",
]
dev = [
    "pytest",
    "pytest-asyncio",
]

[project.urls]
Homepage = "https://github.com/chengzhag/qmd-py"
Repository = "https://github.com/chengzhag/qmd-py"
Issues = "https://github.com/chengzhag/qmd-py/issues"

[project.scripts]
qmd = "qmd.cli.main:main"

[tool.setuptools.packages.find]
include = ["qmd*"]
exclude = ["reference*", "tests*"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
