[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qmd"
version = "0.1.1"
description = "An on-device hybrid search engine for Markdown documents"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Chengzhang Yu"}]
keywords = ["search", "rag", "markdown", "bm25", "vector-search", "mcp"]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "sqlite-vec",
    "pydantic",
    "loguru",
    "numpy",
    "PyYAML>=6.0",
    "sentence-transformers",
    "transformers>=4.41",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]
testing = [
    "pytest",
    "pytest-asyncio",
    "rank-bm25",
    "deepdiff",
]
perf = [
    "datasets>=2.18",
    "pytest-benchmark>=4.0",
]

[project.urls]
Homepage = "https://github.com/chengzhag/qmd-py"
Repository = "https://github.com/chengzhag/qmd-py"
Issues = "https://github.com/chengzhag/qmd-py/issues"

[project.scripts]
qmd = "qmd.cli.__main__:main"

[tool.setuptools.packages.find]
include = ["qmd*"]
exclude = ["reference*", "tests*"]

[project.entry-points.pytest11]
qmd_contract = "qmd.testing.contract"

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
markers = [
    "perf: 性能基准测试，默认 skip，显式 `pytest -m perf` 触发",
    "reranker: 需要加载真实 Qwen3-Reranker 模型（~1.2GB），默认 skip，`pytest -m reranker` 触发",
    "expander: 需要加载真实 Qwen3-0.6B 模型（~1.2GB），默认 skip，`pytest -m expander` 触发",
]
addopts = "-m 'not perf and not reranker and not expander'"
